name: Build Windows EXE
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem build/source.b64.* | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('source-good.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path source-good.zip -DestinationPath src -Force
          if (!(Test-Path src/main.py)) { throw 'main.py missing after extraction' }
          if (!(Test-Path src/requirements.txt)) { throw 'requirements.txt missing after extraction' }
      - name: Install dependencies
        shell: pwsh
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build EXE
        shell: pwsh
        run: |
          cd src
          pyinstaller --noconfirm --clean --onefile --windowed --name GitHubContentOps main.py
          if (!(Test-Path dist/GitHubContentOps.exe)) { throw 'EXE was not generated' }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GitHubContentOps-Windows
          path: src/dist/GitHubContentOps.exe
          if-no-files-found: error
